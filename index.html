<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lean | Estudio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#182e2b;font:16px system-ui}header{background:#143b35;color:white;padding:28px max(5%,20px)}header h1{margin:0;font-size:32px}header p{color:#b9d7ce}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button,select,input{font:inherit;border:1px solid #cbd8d3;border-radius:9px;padding:11px;background:white;color:#143b35}button{cursor:pointer}button.primary,nav button.active{background:#18775e;color:white;border-color:#18775e}main{max-width:1050px;margin:auto;padding:24px}article,.panel{background:white;border:1px solid #dce5e1;border-radius:16px;padding:20px;margin:12px 0}h2,h3{margin-top:0}small{color:#60756e}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric{font-size:32px;font-weight:700}.bar{height:12px;background:#e2ebe6;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#24916f}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:150px}.term{display:flex;gap:14px;align-items:flex-start}.term input{width:23px;height:23px;flex-shrink:0;accent-color:#18775e}.term p{margin:8px 0;line-height:1.55}.flash{text-align:center;min-height:260px;display:grid;place-content:center;cursor:pointer;background:#fff;border:2px solid #c8ded5}.flash h2{font-size:clamp(22px,4vw,34px)}.good{color:#08714d}.bad{color:#ad3838}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4ebe7}footer{padding:20px;text-align:center;color:#60756e;font-size:13px}a{color:#18775e}button:disabled{opacity:.4;cursor:default}
</style><header><small style="color:#b9d7ce">INGENIERÍA INDUSTRIAL · BIBLIOTECA DE ESTUDIO</small><h1>Lean / Estudio</h1><p>Comprende. Practica. Mejora.</p><nav id="nav"></nav></header><main id="main"></main><footer>Glosario del curso · Definiciones didácticas complementarias · <a href="https://www.tiendalean.com/pages/glosario-de-terminos-1">Referencia indicada en el documento</a></footer><script>
const D=[["¿Qué son las 5S?", "Método de organización del puesto: clasificar, ordenar, limpiar, estandarizar y mantener la disciplina."], ["¿Qué es un A3 report?", "Informe de una página A3 que estructura un problema, sus causas, contramedidas y seguimiento."], ["¿Qué es la representación ABC? ¿Qué es un diagrama de Pareto?", "ABC clasifica elementos por importancia acumulada; Pareto ordena frecuencias o impactos y muestra su acumulado para priorizar."], ["¿Qué es un AMFE?", "Análisis modal de fallos y efectos: identifica fallos potenciales, consecuencias y riesgos para prevenirlos."], ["¿Qué es un cuello de botella?", "Recurso cuya capacidad limita el rendimiento del proceso completo."], ["¿Qué es un Andon?", "Sistema visual o sonoro que comunica anomalías y solicita asistencia inmediata."], ["¿Qué es Jidoka?", "Automatización con capacidad de detectar anomalías y detener el proceso para evitar defectos."], ["¿Qué es el Benchmarking?", "Comparación sistemática de prácticas y resultados con referentes para identificar mejoras."], ["¿Qué es Canvas?", "Modelo visual de negocio que describe nueve bloques, desde clientes y propuesta de valor hasta costes e ingresos."], ["¿Qué es Catchball?", "Intercambio iterativo de propuestas entre niveles de la organización para acordar objetivos y planes."], ["¿Qué es una célula en U?", "Distribución de puestos en forma de U que facilita flujo, comunicación y flexibilidad del personal."], ["¿Qué es chau-chaku?", "Chaku-chaku: secuencia de trabajo en la que el operario carga máquinas sucesivas, normalmente con descarga automática."], ["¿Qué es el Ciclo de Deming?", "Ciclo PDCA: planificar, hacer, verificar y actuar para mejorar continuamente."], ["¿Qué es el desperdicio en un entorno LEAN?", "Actividad que consume recursos sin aportar valor al cliente; incluye esperas, defectos y sobreproducción."], ["¿Qué es QFD?", "Despliegue de la función de calidad: traduce necesidades del cliente en requisitos técnicos."], ["¿Qué son las economias de escala?", "Reducción del coste medio por unidad al aumentar el volumen de producción, dentro de ciertos límites."], ["¿Qué es el empowerment?", "Delegación de autoridad, recursos y responsabilidad para que las personas puedan tomar decisiones."], ["¿Qué es EPEI?", "Every Part Every Interval: intervalo necesario para fabricar cada referencia de una familia de productos."], ["¿Qué es la estandarización?", "Definición y documentación del mejor método conocido para ejecutar una tarea de manera consistente."], ["¿Qué es un evento Kaizen?", "Actividad intensiva y breve de un equipo para mejorar un proceso concreto."], ["¿Qué es FIFO?", "First In, First Out: lo primero que entra es lo primero que sale."], ["¿Qué es el FLOW en un entorno LEAN?", "Movimiento continuo de materiales o información a través del proceso con mínimas interrupciones."], ["¿Qué es FTQ?", "First Time Quality: proporción de unidades conformes a la primera, sin retrabajo."], ["¿Qué es un GAP en un entorno LEAN?", "Brecha entre el desempeño actual y el objetivo o estándar esperado."], ["¿Qué es Genchi Genbutsu?", "Ir al lugar real y observar los hechos directamente para comprender un problema."], ["¿Qué es OBC?", "Operator Balance Chart: gráfico que compara las cargas de trabajo de los operarios con el takt time."], ["¿Qué es Heijunka?", "Nivelación del volumen y la mezcla de producción para reducir fluctuaciones."], ["¿Qué es el templo LEAN?", "Representación del sistema Lean con pilares Just in Time y Jidoka, apoyados en estabilidad y mejora continua."], ["¿Qué es la hoja de instrucciones?", "Documento que especifica pasos, condiciones y puntos clave para realizar una tarea correctamente."], ["¿Qué es un Hoshin Kanri?", "Método de despliegue estratégico que alinea objetivos, acciones, responsables y seguimiento."], ["¿Qué es un Diagrama Ishikawa?", "Diagrama de causa y efecto o espina de pescado que organiza posibles causas de un problema."], ["¿Qué es Jidoka?", "Automatización con detección de anomalías y parada para impedir que los defectos avancen."], ["¿Qué es Just inTime?", "Producir y entregar lo necesario, en la cantidad necesaria y en el momento necesario."], ["¿Qué es Kaizen?", "Mejora continua mediante cambios sistemáticos, con participación de las personas."], ["¿Qué es Kamishibi?", "Kamishibai: sistema visual de tarjetas para programar y verificar auditorías o tareas rutinarias."], ["¿Qué es un KPI?", "Indicador clave de desempeño que mide el avance hacia un objetivo."], ["¿Qué es Kanban?", "Señal visual o electrónica que autoriza producción o reposición según consumo."], ["¿Qué es un Layout?", "Distribución física de equipos, áreas y recursos dentro de una instalación."], ["¿Qué es Lean?", "Filosofía de gestión orientada a maximizar valor para el cliente y eliminar desperdicios mediante mejora continua."], ["¿Qué es Mantenimiento autónomo?", "Actividades básicas de limpieza, inspección y cuidado del equipo realizadas por sus operarios."], ["¿Qué es una matriz de polivalencia?", "Tabla que muestra competencias y niveles de dominio de cada trabajador en distintas tareas."], ["¿Qué es una matriz de priorización?", "Herramienta que ordena alternativas mediante criterios y, cuando corresponde, ponderaciones."], ["¿Qué es un Milk Run?", "Ruta logística periódica que recoge o entrega materiales en varios puntos de manera coordinada."], ["¿Qué es Muda?", "Término japonés para desperdicio: consumo de recursos sin generar valor."], ["¿Qué es OEE?", "Eficiencia global del equipo: disponibilidad × rendimiento × calidad."], ["¿Qué es un OEE y TEEP?", "OEE mide eficiencia durante tiempo planificado; TEEP incorpora además la utilización del tiempo calendario."], ["¿Qué es una OPL / LUP?", "One Point Lesson / Lección de un punto: instrucción breve y visual sobre un conocimiento o tarea específica."], ["¿Qué es un Poka Yoke?", "Dispositivo o método a prueba de errores que previene o detecta equivocaciones."], ["¿Qué es PULL en un entorno Lean Manufacturing?", "Sistema en el que el consumo o demanda posterior activa la producción o reposición anterior."], ["¿Qué es un QQDCCP?", "Método de preguntas para caracterizar un problema: qué, quién, dónde, cuándo, cómo, cuánto y por qué."], ["¿Qué es un Root Cause?", "Causa raíz: origen subyacente de un problema cuya eliminación reduce su recurrencia."], ["¿Qué es Shojinka?", "Flexibilidad para ajustar la cantidad de operarios a la demanda mediante polivalencia y organización del trabajo."], ["¿Qué es un objetivo SMART?", "Objetivo específico, medible, alcanzable, relevante y limitado en el tiempo."], ["¿Qué es SMED?", "Single Minute Exchange of Die: metodología para reducir tiempos de cambio de referencia, idealmente a menos de diez minutos."], ["¿Qué es un Supermercado en un entorno Lean Manufacturing?", "Inventario controlado del que se retira material y cuya reposición se activa por consumo."], ["¿Qué es el Takt Time?", "Ritmo requerido por la demanda: tiempo disponible de producción dividido entre demanda del cliente."], ["¿Qué es TPM?", "Mantenimiento productivo total: sistema participativo para maximizar la efectividad de los equipos."], ["¿Qué es TPS?", "Toyota Production System: sistema de producción basado en Just in Time, Jidoka y eliminación de desperdicios."], ["¿Qué es TQC?", "Total Quality Control: gestión de la calidad con participación de todas las áreas de la organización."], ["¿Qué es VSM?", "Value Stream Mapping: mapa de flujos de materiales e información para identificar desperdicios y diseñar mejoras."], ["¿Qué es WIP?", "Work in Process: inventario de productos que se encuentran en proceso de fabricación."], ["¿Qué es Yamazumi?", "Gráfico de barras apiladas que muestra tiempos de tareas por operario o estación para equilibrar cargas."], ["¿Qué es ZQZ?", "ZQZ: denominación no inequívoca; verificar su significado exacto en el material del curso antes de memorizarlo."]];
const key='lean-study-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db.profiles??={};let user=db.current||'Invitado';function profile(){return db.profiles[user]??=( {done:{},scores:{},sessions:[],active:null})}let p=profile(),page='Inicio',filter='todos',search='',revealed=false;const main=document.querySelector('#main');function save(){db.current=user;try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('No se pudo guardar en este navegador.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(){let s=Object.values(p.scores),g=s.reduce((a,x)=>a+x.g,0),b=s.reduce((a,x)=>a+x.b,0);return {g,b,n:Object.values(p.done).filter(Boolean).length,rate:g+b?Math.round(100*g/(g+b)):0}}function go(x){page=x;render()}function render(){document.querySelector('#nav').innerHTML=['Inicio','Glosario','Tarjetas','Estadísticas','Cuenta'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let s=stats();if(page==='Inicio'){main.innerHTML=`<h2>Tu progreso · ${esc(user)}</h2><div class="metrics">${[['Comprendidos',s.n+'/'+D.length],['Aciertos',s.rate+'%'],['Respuestas',s.g+s.b],['Sesiones',p.sessions.length]].map(x=>`<article><small>${x[0]}</small><div class="metric">${x[1]}</div></article>`).join('')}</div><article><h3>Dominio del glosario</h3><div class="bar"><i style="width:${100*s.n/D.length}%"></i></div><p>${D.length-s.n} conceptos pendientes.</p><button class="primary" onclick="go('Tarjetas')">Repasar ahora</button> <button onclick="go('Glosario')">Ver conceptos</button></article>`}if(page==='Glosario'){main.innerHTML=`<h2>Glosario · ${D.length} puntos</h2><div class="tools"><input id="search" placeholder="Buscar concepto o definición" value="${esc(search)}" oninput="search=this.value;terms()"><select onchange="filter=this.value;terms()"><option value="todos">Todos</option><option value="pendientes">Pendientes</option><option value="hechos">Comprendidos</option></select></div><div id="terms"></div>`;main.querySelector('select').value=filter;terms()}if(page==='Tarjetas'){let a=p.active;if(!a){main.innerHTML=`<h2>Sesión de estudio</h2><article><h3>Selecciona qué repasar</h3><div class="tools"><button class="primary" onclick="start('all')">Todos</button><button onclick="start('weak')">Errores anteriores</button><button onclick="start('pending')">No comprendidos</button></div></article>`;return}let i=a.ids[a.pos];main.innerHTML=`<h2>Tarjetas de estudio</h2><small>Tarjeta ${a.pos+1} de ${a.ids.length} · ${a.answers.filter(x=>x.ok).length} aciertos</small><div class="bar"><i style="width:${100*a.pos/a.ids.length}%"></i></div><article class="flash" onclick="revealed=!revealed;render()" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();revealed=!revealed;render()}"><small>${revealed?'DEFINICIÓN':'CONCEPTO '+(i+1)}</small><h2>${esc(D[i][revealed?1:0])}</h2><small>Toca para ${revealed?'ver pregunta':'revelar respuesta'}</small></article><div class="tools"><button ${revealed?'':'disabled'} class="primary" onclick="answer(true)">✓ Lo sabía</button><button ${revealed?'':'disabled'} onclick="answer(false)">✕ No lo sabía</button><button onclick="finish()">Finalizar sesión</button></div>`}if(page==='Estadísticas'){let ranked=Object.entries(p.scores).sort((a,b)=>b[1].g/(b[1].g+b[1].b)-a[1].g/(a[1].g+a[1].b));let rows=r=>r.map(([i,v])=>`<p>${esc(D[i][0])} <strong>${Math.round(100*v.g/(v.g+v.b))}%</strong> <small>(${v.g} bien / ${v.b} mal)</small></p>`).join('')||'<p>Sin datos todavía.</p>';main.innerHTML=`<h2>Rendimiento</h2><div class="metrics"><article><h3 class="good">Mejores conceptos</h3>${rows(ranked.slice(0,5))}</article><article><h3 class="bad">Conceptos a reforzar</h3>${rows([...ranked].reverse().slice(0,5))}</article></div><article><h3>Historial de sesiones</h3>${p.sessions.slice().reverse().map((v,j)=>`<details><summary>${new Date(v.date).toLocaleString('es')} · ${v.answers.filter(x=>x.ok).length}/${v.answers.length} aciertos</summary>${v.answers.map(x=>`<p class="${x.ok?'good':'bad'}">${x.ok?'✓':'✕'} ${esc(D[x.i][0])}</p>`).join('')}</details>`).join('')||'Aún no hay sesiones.'}</article><article><h3>Todos los conceptos evaluados</h3>${rows(ranked)}</article>`}if(page==='Cuenta'){main.innerHTML=`<h2>Perfiles locales</h2><article><p>Perfil actual: <strong>${esc(user)}</strong></p><div class="tools"><input id="name" maxlength="60" placeholder="Nombre del nuevo perfil"><button class="primary" onclick="create()">Crear perfil</button></div><p>Seleccionar perfil existente:</p>${Object.keys(db.profiles).map(n=>`<button data-name="${esc(n)}" onclick="switchUser(this.dataset.name)">${esc(n)}</button> `).join('')}<p><small>Los perfiles y el progreso se guardan en este navegador. No son cuentas en línea ni tienen contraseña o sincronización.</small></p><button onclick="backup()">Exportar progreso</button></article>`}}function terms(){document.querySelector('#terms').innerHTML=D.map(([q,a],i)=>({q,a,i})).filter(x=>(x.q+' '+x.a).toLowerCase().includes(search.toLowerCase())&&(filter==='todos'||(filter==='hechos'?p.done[x.i]:!p.done[x.i]))).map(x=>`<article class="term"><input type="checkbox" aria-label="Concepto comprendido" ${p.done[x.i]?'checked':''} onchange="p.done[${x.i}]=this.checked;save();terms()"><div><small>CONCEPTO ${x.i+1}</small><strong style="display:block">${esc(x.q)}</strong><p>${esc(x.a)}</p></div></article>`).join('')||'<p>No hay coincidencias.</p>'}function start(mode){let ids=D.map((_,i)=>i).filter(i=>mode==='all'||(mode==='pending'?!p.done[i]:p.scores[i]?.last===false));if(!ids.length){alert('No hay conceptos en esta selección.');return}for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}p.active={ids,pos:0,answers:[]};revealed=false;save();render()}function answer(ok){if(!revealed||!p.active)return;let a=p.active,i=a.ids[a.pos],v=p.scores[i]??={g:0,b:0};v[ok?'g':'b']++;v.last=ok;a.answers.push({i,ok});a.pos++;revealed=false;if(a.pos===a.ids.length)finish();else{save();render()}}function finish(){if(p.active.answers.length)p.sessions.push({date:new Date().toISOString(),answers:p.active.answers});p.active=null;revealed=false;save();go('Estadísticas')}function switchUser(n){user=n;p=profile();revealed=false;save();go('Inicio')}function create(){let n=document.querySelector('#name').value.trim();if(!n)return;if(['__proto__','constructor','prototype'].includes(n)||Object.hasOwn(db.profiles,n)){alert('Elige otro nombre.');return}switchUser(n)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='lean-progreso.json';a.click();URL.revokeObjectURL(a.href)}save();render();</script></html>
