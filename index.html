</style><header><small style="color:#b9d7ce">COSTOS INDUSTRIALES · TARJETAS DE ESTUDIO</small><h1>Terminología Lean</h1><p>Aprender, mejorar y crecer.</p><nav id="nav"></nav></header><main id="main"></main><footer>Glosario del curso · Definiciones didácticas complementarias · <a href="https://www.tiendalean.com/pages/glosario-de-terminos-1">Referencia indicada en el documento</a></footer><script>
const D=[["¿Qué son las 5S?", "Método de organización del puesto: clasificar, ordenar, limpiar, estandarizar y mantener la disciplina."], ["¿Qué es un A3 report?", "Informe de una página A3 que estructura un problema, sus causas, contramedidas y seguimiento."], ["¿Qué es la representación ABC? ¿Qué es un diagrama de Pareto?", "ABC clasifica elementos por importancia acumulada; Pareto ordena frecuencias o impactos y muestra su acumulado para priorizar."], ["¿Qué es un AMFE?", "Análisis modal de fallos y efectos: identifica fallos potenciales, consecuencias y riesgos para prevenirlos."], ["¿Qué es un cuello de botella?", "Recurso cuya capacidad limita el rendimiento del proceso completo."], ["¿Qué es un Andon?", "Sistema visual o sonoro que comunica anomalías y solicita asistencia inmediata."], ["¿Qué es Jidoka?", "Automatización con capacidad de detectar anomalías y detener el proceso para evitar defectos."], ["¿Qué es el Benchmarking?", "Comparación sistemática de prácticas y resultados con referentes para identificar mejoras."], ["¿Qué es Canvas?", "Modelo visual de negocio que describe nueve bloques, desde clientes y propuesta de valor hasta costes e ingresos."], ["¿Qué es Catchball?", "Intercambio iterativo de propuestas entre niveles de la organización para acordar objetivos y planes."], ["¿Qué es una célula en U?", "Distribución de puestos en forma de U que facilita flujo, comunicación y flexibilidad del personal."], ["¿Qué es chau-chaku?", "Chaku-chaku: secuencia de trabajo en la que el operario carga máquinas sucesivas, normalmente con descarga automática."], ["¿Qué es el Ciclo de Deming?", "Ciclo PDCA: planificar, hacer, verificar y actuar para mejorar continuamente."], ["¿Qué es el desperdicio en un entorno LEAN?", "Actividad que consume recursos sin aportar valor al cliente; incluye esperas, defectos y sobreproducción."], ["¿Qué es QFD?", "Despliegue de la función de calidad: traduce necesidades del cliente en requisitos técnicos."], ["¿Qué son las economias de escala?", "Reducción del coste medio por unidad al aumentar el volumen de producción, dentro de ciertos límites."], ["¿Qué es el empowerment?", "Delegación de autoridad, recursos y responsabilidad para que las personas puedan tomar decisiones."], ["¿Qué es EPEI?", "Every Part Every Interval: intervalo necesario para fabricar cada referencia de una familia de productos."], ["¿Qué es la estandarización?", "Definición y documentación del mejor método conocido para ejecutar una tarea de manera consistente."], ["¿Qué es un evento Kaizen?", "Actividad intensiva y breve de un equipo para mejorar un proceso concreto."], ["¿Qué es FIFO?", "First In, First Out: lo primero que entra es lo primero que sale."], ["¿Qué es el FLOW en un entorno LEAN?", "Movimiento continuo de materiales o información a través del proceso con mínimas interrupciones."], ["¿Qué es FTQ?", "First Time Quality: proporción de unidades conformes a la primera, sin retrabajo."], ["¿Qué es un GAP en un entorno LEAN?", "Brecha entre el desempeño actual y el objetivo o estándar esperado."], ["¿Qué es Genchi Genbutsu?", "Ir al lugar real y observar los hechos directamente para comprender un problema."], ["¿Qué es OBC?", "Operator Balance Chart: gráfico que compara las cargas de trabajo de los operarios con el takt time."], ["¿Qué es Heijunka?", "Nivelación del volumen y la mezcla de producción para reducir fluctuaciones."], ["¿Qué es el templo LEAN?", "Representación del sistema Lean con pilares Just in Time y Jidoka, apoyados en estabilidad y mejora continua."], ["¿Qué es la hoja de instrucciones?", "Documento que especifica pasos, condiciones y puntos clave para realizar una tarea correctamente."], ["¿Qué es un Hoshin Kanri?", "Método de despliegue estratégico que alinea objetivos, acciones, responsables y seguimiento."], ["¿Qué es un Diagrama Ishikawa?", "Diagrama de causa y efecto o espina de pescado que organiza posibles causas de un problema."], ["¿Qué es Jidoka?", "Automatización con detección de anomalías y parada para impedir que los defectos avancen."], ["¿Qué es Just inTime?", "Producir y entregar lo necesario, en la cantidad necesaria y en el momento necesario."], ["¿Qué es Kaizen?", "Mejora continua mediante cambios sistemáticos, con participación de las personas."], ["¿Qué es Kamishibi?", "Kamishibai: sistema visual de tarjetas para programar y verificar auditorías o tareas rutinarias."], ["¿Qué es un KPI?", "Indicador clave de desempeño que mide el avance hacia un objetivo."], ["¿Qué es Kanban?", "Señal visual o electrónica que autoriza producción o reposición según consumo."], ["¿Qué es un Layout?", "Distribución física de equipos, áreas y recursos dentro de una instalación."], ["¿Qué es Lean?", "Filosofía de gestión orientada a maximizar valor para el cliente y eliminar desperdicios mediante mejora continua."], ["¿Qué es Mantenimiento autónomo?", "Actividades básicas de limpieza, inspección y cuidado del equipo realizadas por sus operarios."], ["¿Qué es una matriz de polivalencia?", "Tabla que muestra competencias y niveles de dominio de cada trabajador en distintas tareas."], ["¿Qué es una matriz de priorización?", "Herramienta que ordena alternativas mediante criterios y, cuando corresponde, ponderaciones."], ["¿Qué es un Milk Run?", "Ruta logística periódica que recoge o entrega materiales en varios puntos de manera coordinada."], ["¿Qué es Muda?", "Término japonés para desperdicio: consumo de recursos sin generar valor."], ["¿Qué es OEE?", "Eficiencia global del equipo: disponibilidad × rendimiento × calidad."], ["¿Qué es un OEE y TEEP?", "OEE mide eficiencia durante tiempo planificado; TEEP incorpora además la utilización del tiempo calendario."], ["¿Qué es una OPL / LUP?", "One Point Lesson / Lección de un punto: instrucción breve y visual sobre un conocimiento o tarea específica."], ["¿Qué es un Poka Yoke?", "Dispositivo o método a prueba de errores que previene o detecta equivocaciones."], ["¿Qué es PULL en un entorno Lean Manufacturing?", "Sistema en el que el consumo o demanda posterior activa la producción o reposición anterior."], ["¿Qué es un QQDCCP?", "Método de preguntas para caracterizar un problema: qué, quién, dónde, cuándo, cómo, cuánto y por qué."], ["¿Qué es un Root Cause?", "Causa raíz: origen subyacente de un problema cuya eliminación reduce su recurrencia."], ["¿Qué es Shojinka?", "Flexibilidad para ajustar la cantidad de operarios a la demanda mediante polivalencia y organización del trabajo."], ["¿Qué es un objetivo SMART?", "Objetivo específico, medible, alcanzable, relevante y limitado en el tiempo."], ["¿Qué es SMED?", "Single Minute Exchange of Die: metodología para reducir tiempos de cambio de referencia, idealmente a menos de diez minutos."], ["¿Qué es un Supermercado en un entorno Lean Manufacturing?", "Inventario controlado del que se retira material y cuya reposición se activa por consumo."], ["¿Qué es el Takt Time?", "Ritmo requerido por la demanda: tiempo disponible de producción dividido entre demanda del cliente."], ["¿Qué es TPM?", "Mantenimiento productivo total: sistema participativo para maximizar la efectividad de los equipos."], ["¿Qué es TPS?", "Toyota Production System: sistema de producción basado en Just in Time, Jidoka y eliminación de desperdicios."], ["¿Qué es TQC?", "Total Quality Control: gestión de la calidad con participación de todas las áreas de la organización."], ["¿Qué es VSM?", "Value Stream Mapping: mapa de flujos de materiales e información para identificar desperdicios y diseñar mejoras."], ["¿Qué es WIP?", "Work in Process: inventario de productos que se encuentran en proceso de fabricación."], ["¿Qué es Yamazumi?", "Gráfico de barras apiladas que muestra tiempos de tareas por operario o estación para equilibrar cargas."], ["¿Qué es ZQZ?", "ZQZ: denominación no inequívoca; verificar su significado exacto en el material del curso antes de memorizarlo."]];
const key='lean-study-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db.profiles??={};let user=db.current||'Invitado';function profile(){return db.profiles[user]??=( {done:{},scores:{},sessions:[],active:null})}let p=profile(),page='Inicio',filter='todos',search='',revealed=false;const main=document.querySelector('#main');function save(){queueCloud();db.current=user.startsWith("cloud:")?"Invitado":user;try{localStorage.setItem(key,JSON.stringify({...db,profiles:Object.fromEntries(Object.entries(db.profiles).filter(([n])=>!n.startsWith("cloud:")))}))}catch{alert('No se pudo guardar en este navegador.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(){let s=Object.values(p.scores),g=s.reduce((a,x)=>a+x.g,0),b=s.reduce((a,x)=>a+x.b,0);return {g,b,n:Object.values(p.done).filter(Boolean).length,rate:g+b?Math.round(100*g/(g+b)):0}}function go(x){page=x;render()}function render(){document.querySelector('#nav').innerHTML=['Inicio','Glosario','Tarjetas','Estadísticas','Cuenta'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let s=stats();if(page==='Inicio'){main.innerHTML=`<h2>Tu progreso · ${esc(window.cloudUser?.email||user)}</h2><div class="metrics">${[['Comprendidos',s.n+'/'+D.length],['Aciertos',s.rate+'%'],['Respuestas',s.g+s.b],['Sesiones',p.sessions.length]].map(x=>`<article><small>${x[0]}</small><div class="metric">${x[1]}</div></article>`).join('')}</div><article><h3>Dominio del glosario</h3><div class="bar"><i style="width:${100*s.n/D.length}%"></i></div><p>${D.length-s.n} conceptos pendientes.</p><button class="primary" onclick="go('Tarjetas')">Repasar ahora</button> <button onclick="go('Glosario')">Ver conceptos</button></article>`}if(page==='Glosario'){main.innerHTML=`<h2>Glosario · ${D.length} puntos</h2><div class="tools"><input id="search" placeholder="Buscar concepto o definición" value="${esc(search)}" oninput="search=this.value;terms()"><select onchange="filter=this.value;terms()"><option value="todos">Todos</option><option value="pendientes">Pendientes</option><option value="hechos">Comprendidos</option></select></div><div id="terms"></div>`;main.querySelector('select').value=filter;terms()}if(page==='Tarjetas'){let a=p.active;if(!a){main.innerHTML=`<h2>Sesión de estudio</h2><article><h3>Selecciona qué repasar</h3><div class="tools"><button class="primary" onclick="start('all')">Todos</button><button onclick="start('weak')">Errores anteriores</button><button onclick="start('pending')">No comprendidos</button></div></article>`;return}let i=a.ids[a.pos];main.innerHTML=`<h2>Tarjetas de estudio</h2><small>Tarjeta ${a.pos+1} de ${a.ids.length} · ${a.answers.filter(x=>x.ok).length} aciertos</small><div class="bar"><i style="width:${100*a.pos/a.ids.length}%"></i></div><div class="flipwrap"><div id="flipcard" class="flipinner ${revealed?'flipped':''}" role="button" tabindex="0" aria-label="Girar tarjeta" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><article class="face"><small>CONCEPTO ${i+1}</small><h2>${esc(D[i][0])}</h2><small>Toca para revelar respuesta</small></article><article class="face back"><small>DEFINICIÓN</small><h2>${esc(D[i][1])}</h2><small>Toca para ver pregunta</small></article></div></div><div class="grade"><button id="yes" ${revealed?'':'disabled'} class="yes" onclick="answer(true)">✓ Lo sabía</button><button id="no" ${revealed?'':'disabled'} class="no" onclick="answer(false)">✕ No lo sabía</button></div><p><button onclick="finish()">Finalizar sesión</button></p>`}if(page==='Estadísticas'){let ranked=Object.entries(p.scores).sort((a,b)=>b[1].g/(b[1].g+b[1].b)-a[1].g/(a[1].g+a[1].b));let rows=r=>r.map(([i,v])=>`<p>${esc(D[i][0])} <strong>${Math.round(100*v.g/(v.g+v.b))}%</strong> <small>(${v.g} bien / ${v.b} mal)</small></p>`).join('')||'<p>Sin datos todavía.</p>';main.innerHTML=`<h2>Rendimiento</h2>${historyChart()}<div class="metrics"><article><h3 class="good">Mejores conceptos</h3>${rows(ranked.slice(0,5))}</article><article><h3 class="bad">Conceptos a reforzar</h3>${rows([...ranked].reverse().slice(0,5))}</article></div><article><h3>Historial de sesiones</h3>${p.sessions.slice().reverse().map((v,j)=>`<details><summary>${new Date(v.date).toLocaleString('es')} · ${v.answers.filter(x=>x.ok).length}/${v.answers.length} aciertos</summary>${v.answers.map(x=>`<p class="${x.ok?'good':'bad'}">${x.ok?'✓':'✕'} ${esc(D[x.i][0])}</p>`).join('')}</details>`).join('')||'Aún no hay sesiones.'}</article><article><h3>Todos los conceptos evaluados</h3>${rows(ranked)}</article>`}if(page==='Cuenta'){main.innerHTML=`<h2>Cuenta</h2>${accountPanel()}<h3>Perfiles locales</h3><article><p>Perfil actual: <strong>${esc(user)}</strong></p><div class="tools"><input id="name" maxlength="60" placeholder="Nombre del nuevo perfil"><button class="primary" onclick="create()">Crear perfil</button></div><p>Seleccionar perfil existente:</p>${Object.keys(db.profiles).filter(n=>!n.startsWith("cloud:")).map(n=>`<button data-name="${esc(n)}" onclick="switchUser(this.dataset.name)">${esc(n)}</button> `).join('')}<p><small>Los perfiles y el progreso se guardan en este navegador. No son cuentas en línea ni tienen contraseña o sincronización.</small></p><button onclick="backup()">Exportar progreso</button></article>`}}function terms(){document.querySelector('#terms').innerHTML=D.map(([q,a],i)=>({q,a,i})).filter(x=>(x.q+' '+x.a).toLowerCase().includes(search.toLowerCase())&&(filter==='todos'||(filter==='hechos'?p.done[x.i]:!p.done[x.i]))).map(x=>`<article class="term"><input type="checkbox" aria-label="Concepto comprendido" ${p.done[x.i]?'checked':''} onchange="p.done[${x.i}]=this.checked;save();terms()"><div><small>CONCEPTO ${x.i+1}</small><strong style="display:block">${esc(x.q)}</strong><p>${esc(x.a)}</p></div></article>`).join('')||'<p>No hay coincidencias.</p>'}function start(mode){let ids=D.map((_,i)=>i).filter(i=>mode==='all'||(mode==='pending'?!p.done[i]:p.scores[i]?.last===false));if(!ids.length){alert('No hay conceptos en esta selección.');return}for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}p.active={ids,pos:0,answers:[]};revealed=false;save();render()}function answer(ok){if(!revealed||!p.active)return;let a=p.active,i=a.ids[a.pos],v=p.scores[i]??={g:0,b:0};v[ok?'g':'b']++;v.last=ok;a.answers.push({i,ok});a.pos++;revealed=false;if(a.pos===a.ids.length)finish();else{save();render()}}function finish(){if(p.active.answers.length)p.sessions.push({date:new Date().toISOString(),answers:p.active.answers});p.active=null;revealed=false;save();go('Estadísticas')}function switchUser(n){if(window.cloudUser){alert("Cierra la sesión en línea primero.");return;}user=n;p=profile();revealed=false;save();go('Inicio')}function create(){let n=document.querySelector('#name').value.trim();if(!n)return;if(['__proto__','constructor','prototype'].includes(n)||Object.hasOwn(db.profiles,n)){alert('Elige otro nombre.');return}switchUser(n)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='lean-progreso.json';a.click();URL.revokeObjectURL(a.href)}
function flip(){revealed=!revealed;document.getElementById('flipcard').classList.toggle('flipped',revealed);for(const id of ['yes','no'])document.getElementById(id).disabled=!revealed;}
function historyChart(){let ss=p.sessions.filter(s=>s.answers.length).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));if(!ss.length)return '<article><h3>Evolución histórica</h3><p>Completa una sesión para ver tu gráfica.</p></article>';let w=Math.max(340,ss.length*105+70),x=i=>55+i*(w-100)/Math.max(1,ss.length-1),y=r=>220-r*1.8;let pts=ss.map((s,i)=>({x:x(i),r:100*s.answers.filter(a=>a.ok).length/s.answers.length,n:s.answers.length,d:new Date(s.date)}));return `<article><h3>Evolución histórica de aciertos</h3><small>Porcentaje por sesión · cantidad de tarjetas bajo cada fecha</small><div class="chartscroll"><svg role="img" aria-label="Historial de aciertos" width="${w}" height="290" viewBox="0 0 ${w} 290">${[0,25,50,75,100].map(r=>`<line x1="45" x2="${w-20}" y1="${y(r)}" y2="${y(r)}" stroke="#dce5e1"/><text x="40" y="${y(r)+4}" text-anchor="end" font-size="11" fill="#60756e">${r}%</text>`).join('')}<polyline points="${pts.map(v=>v.x+','+y(v.r)).join(' ')}" fill="none" stroke="#18775e" stroke-width="3"/>${pts.map(v=>`<circle cx="${v.x}" cy="${y(v.r)}" r="5" fill="#18775e"><title>${esc(v.d.toLocaleString('es'))}: ${v.r.toFixed(1)}%, ${v.n} tarjetas</title></circle><text x="${v.x}" y="${y(v.r)-12}" text-anchor="middle" font-size="12" font-weight="bold">${Math.round(v.r)}%</text><text x="${v.x}" y="240" text-anchor="middle" font-size="11">${v.d.toLocaleDateString('es')}</text><text x="${v.x}" y="255" text-anchor="middle" font-size="10">${v.d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</text><text x="${v.x}" y="270" text-anchor="middle" font-size="11">${v.n} tarjetas</text>`).join('')}</svg></div></article>`}
function accountPanel(){if(!window.cloudReady)return '<article><h3>Cuentas en línea</h3><p>Pendiente de configurar Firebase. Los perfiles locales siguen disponibles.</p></article>';if(window.cloudUser)return `<article><p>Sesión iniciada: ${esc(window.cloudUser.email)}</p><p id="syncstatus">${esc(window.syncStatus||'')}</p><button onclick="cloudAction('logout')">Cerrar sesión</button></article>`;return `<article><h3>Acceso en línea</h3><form class="authform" onsubmit="event.preventDefault();cloudAction('login')"><input id="email" type="email" placeholder="Correo electrónico" required><input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" required><button class="primary" type="submit">Iniciar sesión</button><button type="button" onclick="cloudAction('register')">Crear cuenta</button><button type="button" onclick="cloudAction('reset')">Recuperar contraseña</button></form><p>Al crear una cuenta podrás importar tu perfil local actual.</p></article>`}

<script type="module">

const config = null;
if(config){try{
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');

window.cloudReady=true;window.cloudWrite=snapshot=>{const uid=window.cloudUser?.uid;if(!uid)return;pending=pending.catch(()=>{}).then(()=>setDoc(doc(store,'users',uid),{progress:snapshot})).then(()=>{window.syncStatus='Progreso sincronizado';}).catch(e=>{window.syncStatus='Error de sincronización: '+e.message;const el=document.getElementById('syncstatus');if(el)el.textContent=window.syncStatus;});};
window.cloudAction=async action=>{if(busy)return;busy=true;try{const email=document.getElementById('email')?.value.trim(),pw=document.getElementById('password')?.value;if(action==='logout'){await pending;await signOut(auth);}else if(action==='reset'){await sendPasswordResetEmail(auth,email);alert('Revisa tu correo.');}else if(action==='register'){await createUserWithEmailAndPassword(auth,email,pw);}else await signInWithEmailAndPassword(auth,email,pw);}catch(e){alert(e.message);}finally{busy=false;}};
onAuthStateChanged(auth,async u=>{window.cloudUser=null;if(!u){if(user.startsWith('cloud:')){user=localUser.startsWith('cloud:')?'Invitado':localUser;p=profile();}render();return;}try{const previous=p;localUser=user;const ref=doc(store,'users',u.uid),snap=await getDoc(ref);user='cloud:'+u.uid;if(snap.exists())db.profiles[user]=snap.data().progress;else if(!db.profiles[user])db.profiles[user]=confirm('¿Importar el progreso del perfil local actual?')?JSON.parse(JSON.stringify(previous)):{done:{},scores:{},sessions:[],active:null};p=profile();window.cloudUser=u;window.syncStatus='Cuenta conectada';save();go('Inicio');}catch(e){alert('No se pudo cargar la cuenta: '+e.message);await signOut(auth);}});render();
}catch(e){console.error(e);alert('No se pudo conectar Firebase.');}}
</script></html>
